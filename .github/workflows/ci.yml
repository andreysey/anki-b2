name: CI

# checks + browser tests (in parallel) → release and deploy. Nothing reaches users unless all passed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint:code

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests with coverage thresholds
        run: npm run test:coverage

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build project
        run: npm run build

      # Uses the Google Chrome preinstalled on the runner (see playwright.config.ts)
      - name: Browser tests (study progress, backup, offline)
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  release-deploy:
    needs: [build-and-test, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # One release at a time: a second push waits instead of racing the first one's version commit
    concurrency:
      group: release-deploy
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The release bot commits and pushes; don't run local git hooks (checks already passed)
          HUSKY: 0

      # semantic-release has bumped package.json here, so the app shows the new version
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
