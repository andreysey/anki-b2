name: Set up Node and dependencies
description: Node from .nvmrc and node_modules restored from cache (npm ci only when package-lock.json changed)

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'

    - id: cache
      uses: actions/cache@v6
      with:
        path: node_modules
        # Node version is part of the key: native modules (better-sqlite3) are built for it
        key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --no-audit --no-fund
