version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Runtime deps → "fix(deps):" (triggers a release + deploy)
    # Dev deps     → "chore(deps-dev):" (no release)
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    ignore:
      # vue-tsc doesn't support TypeScript 7 yet
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Keep in line with the Node major we run (26, see .nvmrc)
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      # One PR for all minor/patch updates instead of one per package
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
