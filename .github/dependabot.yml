version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Runtime deps → "fix(deps):" (triggers a release + deploy)
    # Dev deps     → "chore(deps-dev):" (no release)
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # One PR for all minor/patch updates instead of one per package
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
