<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https: blob: data:;"
    />
    <title>Anki B2 — German B1+/B2 Professional Vocabulary Trainer</title>
    <meta
      name="description"
      content="Interactive German B1+/B2 Beruf vocabulary trainer & native Anki packages. Features Leitner SRS, speech audio, and AI grammar explanations."
    />
    <meta name="keywords" content="German, B2, B1, Deutsch, Beruf, Vocabulary, Anki, CEFR, Leitner, SRS, Flashcards" />
    <meta name="author" content="Andrey Sey" />

    <!-- Open Graph / Facebook / Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://andreysey.github.io/anki-b2/" />
    <meta property="og:title" content="Anki B2 — German B1+/B2 Professional Vocabulary" />
    <meta
      property="og:description"
      content="Interactive German B1+/B2 Beruf vocabulary trainer & native Anki packages with Leitner SRS, audio pronunciation, and AI assistant."
    />
    <meta property="og:image" content="https://andreysey.github.io/anki-b2/icon-512.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Anki B2 — German B1+/B2 Professional Vocabulary" />
    <meta
      name="twitter:description"
      content="Interactive German B1+/B2 Beruf vocabulary trainer & native Anki packages with Leitner SRS, audio pronunciation, and AI assistant."
    />
    <meta name="twitter:image" content="https://andreysey.github.io/anki-b2/icon-512.png" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      (function () {
        try {
          const theme = localStorage.getItem('anki_theme_mode') || 'system';
          const isDark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
