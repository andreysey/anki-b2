<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background subtle dark gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glass card surface gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- German Flag: Gold vibrant glow -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>

    <!-- German Flag: Red vibrant glow -->
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef233c" />
      <stop offset="100%" stop-color="#d90429" />
    </linearGradient>

    <!-- Text cyan neon glow -->
    <linearGradient id="cyanNeon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Card shadow filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base App Icon Container (Squircle / Rounded Box) -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- German Tricolor Speech Bubble / Accent (Top-Left) -->
  <g transform="translate(9, 10)">
    <!-- Speech bubble shape with flag bands -->
    <clipPath id="bubbleClip">
      <rect width="20" height="15" rx="4" />
    </clipPath>
    <g clip-path="url(#bubbleClip)">
      <rect x="0" y="0" width="20" height="5" fill="#111827" />
      <rect x="0" y="5" width="20" height="5" fill="url(#redGrad)" />
      <rect x="0" y="10" width="20" height="5" fill="url(#goldGrad)" />
    </g>
    <!-- Little speech tail -->
    <polygon points="4,15 4,19 9,15" fill="url(#goldGrad)" />
  </g>

  <!-- Stacked Deck (Back Card) -->
  <g transform="translate(24, 18) rotate(12)" filter="url(#cardShadow)">
    <rect width="28" height="38" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" opacity="0.8" />
  </g>

  <!-- Front Hero Flashcard -->
  <g transform="translate(18, 15) rotate(-6)" filter="url(#cardShadow)">
    <!-- Card Body -->
    <rect width="30" height="40" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <rect width="30" height="40" rx="6" fill="url(#glassGrad)" />

    <!-- German Flag Stripe on the card top edge -->
    <rect x="0" y="0" width="30" height="2" fill="#ef233c" rx="1" />
    <rect x="0" y="2" width="30" height="1.5" fill="#ffb703" />

    <!-- Bold 'B2' Centerpiece -->
    <text x="15" y="25"
          text-anchor="middle"
          fill="#f8fafc"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="14"
          font-weight="900"
          letter-spacing="-0.5">B2</text>

    <!-- Small stylish flashcard check badge -->
    <circle cx="15" cy="33" r="3.5" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <polyline points="13.2,33 14.5,34.3 17,31.8" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>